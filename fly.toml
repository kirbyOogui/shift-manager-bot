# fly.toml - アプリ名は "fly launch" 実行時に設定される
app = "shift-manager-bot"  # デプロイ前に任意の名前に変更してください
primary_region = "nrt"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # 常時1台起動（APScheduler維持のため）

[[vm]]
  memory = "2gb"        # PaddleOCR モデル + ランタイムに最低 1GB 必要、余裕を持って 2GB
  cpu_kind = "shared"
  cpus = 1
